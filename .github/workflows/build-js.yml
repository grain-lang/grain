# This workflow exists to provide a way to dispatch a CI run for any
# given ref on any of our OS targets. It can also be consumed in our
# various other builds.
name: (js) Build and test

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system to run CI on
        type: choice
        required: true
        default: "ubuntu-latest"
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
      ref:
        description: Git reference to checkout
        type: string
        required: false
  workflow_call:
    inputs:
      os:
        description: Operating system to run CI on
        type: string
        required: true
      ref:
        description: Git reference to checkout
        type: string
        required: false

env:
  ESY__PREFIX: ${{ github.workspace }}/.esy/
  
jobs:
  build:
    name: (js) Build and test
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=22.13 <23"
          check-latest: true
          cache: "npm"

      - name: Install npm dependencies
        run: |
          npm ci

      - name: Esy cache
        id: esy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.1
        with:
          path: compiler/_export
          key: ${{ runner.os }}-esy-${{ hashFiles('compiler/esy.lock/index.json') }}

      - name: Esy setup
        # Don't crash the run if esy cache import fails - mostly happens on Windows
        continue-on-error: true
        run: |
          npm run compiler prepare
          npm run compiler import-dependencies

      # Don't build native executables, only the JS builds
      - name: Build compiler
        run: |
          npm run compiler build:js

      - name: Run tests
        run: |
          npm run compiler test:js

      - name: Upload js compiler artifacts
        if: inputs.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-compiler
          path: cli/bin/*.bc.js

  package:
    name: (js) Package ${{ matrix.target }}
    needs: [build]
    if: inputs.os == 'ubuntu-latest'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-latest
          - target: mac-x64
            runner: macos-latest
          - target: mac-arm64
            runner: macos-latest
          - target: win-x64
            runner: ubuntu-latest
            ext: .exe
          - target: win-arm64
            runner: ubuntu-latest
            ext: .exe

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=22.13 <23"
          check-latest: true
          cache: "npm"

      - name: Install npm dependencies
        run: |
          npm ci --ignore-scripts

      - name: Fetch js compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-compiler
          path: cli/bin

      - name: Build pkg binary
        run: |
          npm run cli build-pkg -- --target=${{ matrix.target }}
          tar -czvf grain-${{ matrix.target }}.tar.gz -C pkg grain${{ matrix.ext }}

      - name: Upload pkg binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./grain-${{ matrix.target }}.tar.gz
          name: grain-${{ matrix.target }}
