name: Test pkg binaries

on:
  workflow_call:
    inputs:
      ref:
        description: Git reference to checkout
        type: string
        required: false

jobs:
  test-pkg:
    name: Test pkg binary for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: mac-x64
            os: macos-latest
          - target: mac-arm64
            os: macos-latest
          - target: win-x64
            os: windows-latest
            ext: .exe
          - target: win-arm64
            os: windows-11-arm
            ext: .exe
    runs-on: ${{ matrix.os }}

    env:
      GRAIN: ./grain${{ matrix.ext }}

    steps:
      - name: Checkout project
        uses:  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Fetch pkg binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grain-${{ matrix.target }}

      - name: Untar download
        run: |
          tar -xzvf grain-${{ matrix.target }}.tar.gz

      # This is to test the CLI is working
      - name: Log Grain version
        run: |
          ${{ env.GRAIN }} -v

      # If we have a working grain CLI, we can run graindoc on stdlib
      - name: (stdlib) Check documentation
        if: ${{ !startsWith(matrix.target, 'win') }}
        run: |
          ${{ env.GRAIN }} doc stdlib -o stdlib --current-version="$(${{ env.GRAIN }} -v)"
          git diff --exit-code --name-only

      # If we have a working grain CLI, we can run grainfmt on stdlib & tests
      - name: (stdlib) Check formatting
        if: ${{ !startsWith(matrix.target, 'win') }}
        run: |
          ${{ env.GRAIN }} format stdlib -o stdlib
          ${{ env.GRAIN }} format compiler/test/stdlib -o compiler/test/stdlib
          git diff --exit-code --name-only

      - name: Smoketest a program
        run: |
          ${{ env.GRAIN }} compiler/test/input/relativeIncludeLinking.gr
